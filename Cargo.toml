[package]
name = "stillvalid"
version = "0.0.1"
edition = "2021"
description = "Checks whether open GitHub issues and pull requests are still valid against the current code, with evidence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lodibrahim/stillvalid"
readme = "README.md"
keywords = ["github", "issues", "triage", "backlog", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
octocrab = "0.54.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
