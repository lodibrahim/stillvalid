name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that stillvalid doesn't help with?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you'd like to happen.
