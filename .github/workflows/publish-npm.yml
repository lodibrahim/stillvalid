# Called by release.yml (dist custom publish job) after the GitHub Release exists.
# Stages the npm package with trusted publishing (no token); a maintainer approves
# it on npmjs.com. See CONTRIBUTING "Releasing".
name: publish-npm
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      # `npm stage publish` needs npm >= 11.15.0 (Node >= 24.18); check-latest skips an
      # older Node 24 cached on the runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm stage publish --access public --provenance "./npm/${pkg}"
          done
