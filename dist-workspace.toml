[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Homebrew tap for the formula. Publishing is off (no "homebrew" in
# publish-jobs): the formula is only attached to the release until the tap repo and its
# HOMEBREW_TAP_TOKEN secret exist.
tap = "lodibrahim/homebrew-tap"
# Sign release artifacts with GitHub artifact attestations (`gh attestation verify`).
github-attestations = true
# npm publish with trusted publishing (dist's builtin "npm" job needs a token);
# see .github/workflows/publish-npm.yml.
publish-jobs = ["./publish-npm"]
github-custom-job-permissions = { "publish-npm" = { contents = "read", id-token = "write" } }

# Pin every action to a full commit SHA (repo rule; see .github/workflows/ci.yml).
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
