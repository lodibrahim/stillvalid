# cargo-deny: known vulnerabilities (RustSec), licenses, and where crates come from.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # rsa timing side channel; no fixed version exists. Pulled in by octocrab's required JWT
    # backend (GitHub App login). stillvalid only sends tokens and never signs with an RSA key.
    { id = "RUSTSEC-2023-0071", reason = "rsa is linked via octocrab JWT support but never used" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
